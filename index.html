<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>건설 기초 용어 퀴즈</title>
  <style>
    :root {
      --bg: #f7fbff;
      --surface: #ffffff;
      --text: #172033;
      --muted: #6d7b91;
      --line: #d8e5f3;
      --idle: #ebf8ff;
      --primary: #0669f7;
      --primary-dark: #0558ce;
      --success: #29b765;
      --success-soft: #e8f9ef;
      --danger: #ef4444;
      --danger-soft: #fff0f0;
      --warning: #ffb020;
      --shadow: 0 18px 45px rgba(18, 65, 115, 0.13);
      --radius: 8px;
      font-family: Inter, Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background:
        linear-gradient(180deg, #ffffff 0%, var(--bg) 46%, #eff8ff 100%);
    }

    button {
      font: inherit;
    }

    .app {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .shell {
      width: min(100%, 560px);
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .close-dot {
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 999px;
      background: #eef5fb;
      color: #76849a;
      display: inline-grid;
      place-items: center;
      cursor: pointer;
    }

    .progress-wrap {
      flex: 1;
      height: 14px;
      border-radius: 999px;
      background: #e6edf5;
      overflow: hidden;
      box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.04);
    }

    .progress {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: var(--success);
      transition: width 260ms ease;
    }

    .card {
      background: var(--surface);
      border: 1px solid rgba(216, 229, 243, 0.8);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: clamp(20px, 5vw, 34px);
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
      animation: rise 240ms ease;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .intro-logo {
      width: clamp(92px, 28vw, 132px);
      height: clamp(92px, 28vw, 132px);
      display: block;
      margin: 0 auto 22px;
      border-radius: 28px;
      box-shadow: 0 14px 28px rgba(255, 184, 34, 0.24);
    }

    .intro-card {
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--primary);
      font-size: 14px;
      font-weight: 800;
    }

    h1,
    h2 {
      margin: 0;
      line-height: 1.12;
      letter-spacing: 0;
    }

    h1 {
      font-size: 36px;
    }

    h2 {
      font-size: 30px;
    }

    .lead {
      margin: 14px 0 0;
      color: var(--muted);
      line-height: 1.65;
      font-size: 16px;
    }

    .intro-subtitle {
      max-width: 390px;
      margin: 14px auto 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: 17px;
      font-weight: 800;
      word-break: keep-all;
    }

    .intro-character {
      display: block;
      width: min(78vw, 340px);
      max-width: 100%;
      height: auto;
      margin: 22px auto 24px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 24px 0;
    }

    .stat {
      min-height: 78px;
      padding: 12px 8px;
      border-radius: var(--radius);
      background: #f4f9fd;
      border: 1px solid var(--line);
      text-align: center;
    }

    .stat strong {
      display: block;
      color: var(--text);
      font-size: 22px;
      line-height: 1.2;
    }

    .stat span {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .primary-btn,
    .ghost-btn {
      width: 100%;
      min-height: 54px;
      border: 0;
      border-radius: var(--radius);
      font-weight: 900;
      cursor: pointer;
      transition: transform 150ms ease, background 150ms ease, box-shadow 150ms ease;
    }

    .primary-btn {
      color: #fff;
      background: var(--primary);
      box-shadow: 0 5px 0 var(--primary-dark);
    }

    .primary-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 var(--primary-dark);
    }

    .primary-btn:disabled {
      background: #a7bdd8;
      box-shadow: 0 5px 0 #879cb8;
      cursor: default;
    }

    .ghost-btn {
      color: var(--primary);
      background: var(--idle);
      border: 1px solid #c7e9ff;
      margin-top: 12px;
    }

    .quiz-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
    }

    .pill {
      padding: 8px 12px;
      border-radius: 999px;
      background: #f1f6fb;
      color: var(--muted);
      white-space: nowrap;
    }

    .question {
      min-height: 92px;
      display: grid;
      align-items: end;
      margin-bottom: 18px;
    }

    .question h2 {
      font-size: 26px;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .question-media {
      width: 100%;
      height: clamp(170px, 38vh, 280px);
      margin-bottom: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #f8fbfe;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .question-media img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 10px;
    }

    .options {
      display: grid;
      gap: 12px;
      margin-bottom: 18px;
    }

    .options.image-options {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .option {
      position: relative;
      width: 100%;
      min-height: 58px;
      padding: 15px 48px 15px 16px;
      border: 2px solid #c8eaff;
      border-radius: var(--radius);
      color: var(--text);
      background: var(--idle);
      text-align: left;
      font-weight: 850;
      cursor: pointer;
      box-shadow: 0 4px 0 #b6e3fb;
      transition: transform 150ms ease, border 150ms ease, background 150ms ease, color 150ms ease, box-shadow 150ms ease;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .option.image-option {
      min-height: 138px;
      padding: 10px;
      display: grid;
      place-items: center;
      text-align: center;
    }

    .option.image-option img {
      width: 100%;
      height: 112px;
      object-fit: contain;
      border-radius: 6px;
      mix-blend-mode: multiply;
    }

    .option:hover {
      transform: translateY(-1px);
    }

    .option.selected {
      border-color: var(--primary);
      color: #fff;
      background: var(--primary);
      box-shadow: 0 4px 0 var(--primary-dark);
    }

    .option.correct {
      border-color: var(--success);
      color: #123522;
      background: var(--success-soft);
      box-shadow: 0 4px 0 #a9e7c4;
    }

    .option.wrong {
      border-color: var(--danger);
      color: #fff;
      background: var(--danger);
      box-shadow: 0 4px 0 #bd2f2f;
    }

    .option[disabled] {
      cursor: default;
    }

    .option .badge {
      position: absolute;
      right: 14px;
      top: 50%;
      width: 24px;
      height: 24px;
      transform: translateY(-50%);
      border-radius: 999px;
      display: grid;
      place-items: center;
      color: currentColor;
      opacity: 0;
    }

    .option.correct .badge,
    .option.wrong .badge,
    .option.selected .badge {
      opacity: 1;
    }

    .feedback {
      min-height: 82px;
      padding: 14px 16px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: #f7fbff;
    }

    .feedback.good {
      border-color: #b7edcd;
      background: var(--success-soft);
    }

    .feedback.bad {
      border-color: #ffc5c5;
      background: var(--danger-soft);
    }

    .feedback-title {
      margin: 0 0 5px;
      font-size: 16px;
      font-weight: 950;
    }

    .feedback-copy {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
      font-size: 14px;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .footer {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }

    .result-badge {
      display: block;
      width: min(64vw, 220px);
      height: auto;
      margin: 0 auto 18px;
    }

    .result-score {
      text-align: center;
      margin-bottom: 22px;
    }

    .result-score h2 {
      margin-bottom: 10px;
    }

    .result-score p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .review {
      max-height: 220px;
      overflow: auto;
      display: grid;
      gap: 8px;
      margin: 18px 0 2px;
      padding-right: 4px;
    }

    .review-item {
      padding: 12px;
      border-radius: var(--radius);
      background: #f6f9fc;
      border: 1px solid var(--line);
      font-size: 13px;
      line-height: 1.45;
    }

    .review-item strong {
      display: block;
      margin-bottom: 3px;
    }

    .review-item.missed {
      background: var(--danger-soft);
      border-color: #ffc5c5;
    }

    .hidden {
      display: none;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 420px) {
      .app {
        padding: 14px;
        align-items: start;
      }

      .shell {
        padding-top: 4px;
      }

      .topbar {
        margin-bottom: 12px;
      }

      .card {
        padding: 20px 16px;
      }

      h1 {
        font-size: 28px;
      }

      h2 {
        font-size: 24px;
      }

      .question h2 {
        font-size: 22px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .stat {
        min-height: 58px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        text-align: left;
      }

      .stat span {
        margin-top: 0;
      }

      .question {
        min-height: 84px;
      }

      .question-media {
        height: clamp(150px, 32vh, 230px);
      }

      .option {
        min-height: 56px;
        padding-left: 14px;
      }

      .option.image-option {
        min-height: 126px;
      }

      .option.image-option img {
        height: 96px;
      }

      .intro-character {
        width: min(86vw, 300px);
        margin-top: 18px;
      }
    }

    @media (min-width: 760px) {
      .footer {
        grid-template-columns: 1fr 1fr;
      }

      .footer .primary-btn:first-child:last-child {
        grid-column: 1 / -1;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="shell">
      <div class="topbar" aria-hidden="true">
        <button class="close-dot" type="button" title="처음으로" id="homeButton">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M18 6 6 18M6 6l12 12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
        </button>
        <div class="progress-wrap">
          <div class="progress" id="progress"></div>
        </div>
      </div>

      <section class="screen active" id="introScreen">
        <div class="card intro-card">
          <img class="intro-logo" src="assets/gada-logo.png" alt="GADA">
          <h1>가다위키 : 건설 현장 용어 맞추기</h1>
          <p class="intro-subtitle">'과연 당신은 가다 반장님의 칭호를 얻을 수 있을 것인가?'</p>
          <img class="intro-character" src="assets/foreman-character.png" alt="가다 반장님 캐릭터">
          <button class="primary-btn" type="button" id="startButton">시작하기</button>
        </div>
      </section>

      <section class="screen" id="quizScreen">
        <div class="card">
          <div class="quiz-head">
            <span id="questionCounter">1 / 15</span>
            <span class="pill" id="categoryPill">수공구</span>
          </div>
          <div class="question">
            <h2 id="questionText"></h2>
          </div>
          <div class="question-media hidden" id="questionMedia">
            <img id="questionImage" src="" alt="">
          </div>
          <div class="options" id="options"></div>
          <div class="feedback hidden" id="feedback" role="status" aria-live="polite">
            <p class="feedback-title" id="feedbackTitle"></p>
            <p class="feedback-copy" id="feedbackCopy"></p>
          </div>
          <div class="footer">
            <button class="primary-btn" type="button" id="nextButton" disabled>확인</button>
          </div>
        </div>
      </section>

      <section class="screen" id="resultScreen">
        <div class="card">
          <img class="result-badge" id="resultBadge" src="assets/results/beginner.png" alt="결과 등급 아이콘">
          <div class="result-score">
            <h2 id="resultTitle">결과</h2>
            <p id="resultCopy"></p>
          </div>
          <div class="stats">
            <div class="stat"><strong id="scoreStat">0</strong><span>정답</span></div>
            <div class="stat"><strong id="accuracyStat">0%</strong><span>정답률</span></div>
            <div class="stat"><strong id="gradeStat">입문</strong><span>등급</span></div>
          </div>
          <div class="review" id="reviewList" aria-label="문제 풀이 요약"></div>
          <div class="footer">
            <button class="primary-btn" type="button" id="retryButton">다시 풀기</button>
            <button class="ghost-btn" type="button" id="eventButton">이벤트 참여</button>
          </div>
        </div>
      </section>
    </div>
  </main>

    const introScreen = document.querySelector("#introScreen");
    const quizScreen = document.querySelector("#quizScreen");
    const resultScreen = document.querySelector("#resultScreen");
    const startButton = document.querySelector("#startButton");
    const retryButton = document.querySelector("#retryButton");
    const eventButton = document.querySelector("#eventButton");
    const homeButton = document.querySelector("#homeButton");
    const nextButton = document.querySelector("#nextButton");
    const progress = document.querySelector("#progress");
    const questionCounter = document.querySelector("#questionCounter");
    const categoryPill = document.querySelector("#categoryPill");
    const questionText = document.querySelector("#questionText");
    const questionMedia = document.querySelector("#questionMedia");
    const questionImage = document.querySelector("#questionImage");
    const optionsWrap = document.querySelector("#options");
    const feedback = document.querySelector("#feedback");
    const feedbackTitle = document.querySelector("#feedbackTitle");
    const feedbackCopy = document.querySelector("#feedbackCopy");
    const resultBadge = document.querySelector("#resultBadge");
    const resultTitle = document.querySelector("#resultTitle");
    const resultCopy = document.querySelector("#resultCopy");
    const scoreStat = document.querySelector("#scoreStat");
    const accuracyStat = document.querySelector("#accuracyStat");
    const gradeStat = document.querySelector("#gradeStat");
    const reviewList = document.querySelector("#reviewList");

    let currentIndex = 0;
    let score = 0;
    let selectedIndex = null;
    let answered = false;
    let answers = [];
    let questions = [];

    function showScreen(screen) {
      [introScreen, quizScreen, resultScreen].forEach((item) => item.classList.remove("active"));
      screen.classList.add("active");
    }

    function updateProgress() {
      const ratio = quizScreen.classList.contains("active")
        ? currentIndex / questions.length
        : resultScreen.classList.contains("active")
          ? 1
          : 0;
      progress.style.width = `${ratio * 100}%`;
    }

    function shuffleArray(items) {
      const mixed = [...items];
      for (let i = mixed.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [mixed[i], mixed[j]] = [mixed[j], mixed[i]];
      }
      return mixed;
    }

    function shuffleOptions(question) {
      return shuffleArray(question.options.map((label, index) => ({ label, originalIndex: index })));
    }

    function optionLabel(option) {
      return typeof option === "string" ? option : option.label;
    }

    function startQuiz() {
      questions = shuffleArray(questionBank).slice(0, QUESTION_COUNT);
      currentIndex = 0;
      score = 0;
      selectedIndex = null;
      answered = false;
      answers = [];
      showScreen(quizScreen);
      renderQuestion();
    }

    function renderQuestion() {
      const item = questions[currentIndex];
      selectedIndex = null;
      answered = false;
      nextButton.disabled = true;
      nextButton.textContent = "다음";
      feedback.className = "feedback hidden";
      feedbackTitle.textContent = "";
      feedbackCopy.textContent = "";
      questionCounter.textContent = `${currentIndex + 1} / ${questions.length}`;
      categoryPill.textContent = item.category;
      questionText.textContent = item.question;
      if (item.image) {
        questionImage.src = item.image;
        questionImage.alt = item.imageAlt || item.question;
        questionMedia.classList.remove("hidden");
      } else {
        questionImage.removeAttribute("src");
        questionImage.alt = "";
        questionMedia.classList.add("hidden");
      }
      optionsWrap.className = item.optionType === "image" ? "options image-options" : "options";
      optionsWrap.innerHTML = "";

      shuffleOptions(item).forEach((option) => {
        const button = document.createElement("button");
        const optionData = option.label;
        button.className = item.optionType === "image" ? "option image-option" : "option";
        button.type = "button";
        button.dataset.index = option.originalIndex;
        if (item.optionType === "image") {
          button.innerHTML = `<img src="${optionData.image}" alt="${optionData.alt || optionData.label}"><span class="sr-only">${optionData.label}</span><span class="badge" aria-hidden="true">✓</span>`;
        } else {
          button.innerHTML = `<span>${optionData}</span><span class="badge" aria-hidden="true">✓</span>`;
        }
        button.addEventListener("click", () => selectOption(button, item));
        optionsWrap.appendChild(button);
      });

      updateProgress();
    }

    function selectOption(button, item) {
      if (answered) return;

      document.querySelectorAll(".option").forEach((option) => {
        option.classList.remove("selected");
        option.querySelector(".badge").textContent = "✓";
      });

      selectedIndex = Number(button.dataset.index);
      button.classList.add("selected");
      nextButton.disabled = false;
      submitAnswer();
    }

    function submitAnswer() {
      const item = questions[currentIndex];

      if (!answered) {
        if (selectedIndex === null) return;

        answered = true;
        const isCorrect = selectedIndex === item.answer;
        if (isCorrect) score += 1;

        answers.push({
          question: item.question,
          correct: isCorrect,
          selected: optionLabel(item.options[selectedIndex]),
          answer: optionLabel(item.options[item.answer])
        });

        document.querySelectorAll(".option").forEach((button) => {
          const optionIndex = Number(button.dataset.index);
          button.disabled = true;

          if (optionIndex === item.answer) {
            button.classList.remove("selected");
            button.classList.add("correct");
            button.querySelector(".badge").textContent = "✓";
          }

          if (optionIndex === selectedIndex && !isCorrect) {
            button.classList.remove("selected");
            button.classList.add("wrong");
            button.querySelector(".badge").textContent = "!";
          }
        });

        feedback.className = `feedback ${isCorrect ? "good" : "bad"}`;
        feedbackTitle.textContent = isCorrect ? "정답입니다" : "아쉬워요";
        feedbackCopy.textContent = isCorrect ? item.note : `정답은 '${optionLabel(item.options[item.answer])}'입니다. ${item.note}`;
        nextButton.textContent = currentIndex === questions.length - 1 ? "결과 보기" : "다음";
        progress.style.width = `${((currentIndex + 1) / questions.length) * 100}%`;
        return;
      }

      if (currentIndex < questions.length - 1) {
        currentIndex += 1;
        renderQuestion();
      } else {
        showResult();
      }
    }

    function getGrade(finalScore) {
      if (finalScore >= 9) {
        return {
          label: "가다 반장님",
          title: "당신이 바로 가다 반장님!",
          copy: "현장 용어 감각이 아주 탄탄합니다.",
          icon: "assets/results/master.png",
          iconAlt: "마스터 등급 헬멧"
        };
      }

      if (finalScore >= 6) {
        return {
          label: "즉시 투입",
          title: "어떤 현장이든 당장 투입 가능!",
          copy: "기본 용어와 장비 구분이 꽤 안정적입니다.",
          icon: "assets/results/advanced.png",
          iconAlt: "고급 등급 헬멧"
        };
      }

      if (finalScore >= 3) {
        return {
          label: "출역 경험자",
          title: "출역 좀 해본 실력이시네요!",
          copy: "현장 용어가 조금씩 몸에 붙어 있는 상태입니다.",
          icon: "assets/results/intermediate.png",
          iconAlt: "중급자 등급 헬멧"
        };
      }

      return {
        label: "현장 입문자",
        title: "건설 현장 입문자시군요?",
        copy: "헷갈린 용어를 다시 보면 다음 점수가 훅 올라갈 거예요.",
        icon: "assets/results/beginner.png",
        iconAlt: "입문자 등급 헬멧"
      };
    }

    function showResult() {
      const accuracy = Math.round((score / questions.length) * 100);
      const grade = getGrade(score);

      showScreen(resultScreen);
      progress.style.width = "100%";
      resultBadge.src = grade.icon;
      resultBadge.alt = grade.iconAlt;
      resultTitle.textContent = grade.title;
      resultCopy.textContent = grade.copy;
      scoreStat.textContent = `${score}/${questions.length}`;
      accuracyStat.textContent = `${accuracy}%`;
      gradeStat.textContent = grade.label;
      reviewList.innerHTML = "";

      answers.forEach((item, index) => {
        const row = document.createElement("div");
        row.className = `review-item ${item.correct ? "" : "missed"}`;
        row.innerHTML = `<strong>${index + 1}. ${item.correct ? "정답" : "오답"} · ${item.answer}</strong><span>${item.question}</span>`;
        reviewList.appendChild(row);
      });
    }

    startButton.addEventListener("click", startQuiz);
    retryButton.addEventListener("click", startQuiz);
    nextButton.addEventListener("click", submitAnswer);
    homeButton.addEventListener("click", () => {
      showScreen(introScreen);
      updateProgress();
    });
    eventButton.addEventListener("click", () => {
      eventButton.textContent = "참여 완료";
      eventButton.disabled = true;
    });
  </script>
